<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1C1C1E">
  <title>Toldya | Verified</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1c1c1e;
      --card: #252530;
      --border: #2c2c38;
      --text: #e8e8ed;
      --muted: #a0a0b0;
      --blue: #2563eb;
      --green: #2ed573;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(46, 213, 115, 0.22), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: rgba(37, 37, 48, 0.9);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .check {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: rgba(46, 213, 115, 0.16);
      color: var(--green);
      font-size: 48px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .pill {
      display: inline-flex;
      margin-top: 22px;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.14);
      color: #ffffff;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>
    <h1 id="title">E-posta doğrulandı</h1>
    <p id="message">Toldya uygulamasına geri dön. Uygulama seni otomatik olarak ana sayfaya alacak.</p>
    <div class="pill">Toldya</div>
  </main>
  <script>
    const copy = {
      tr: {
        title: 'E-posta doğrulandı',
        message: 'Toldya uygulamasına geri dön. Uygulama seni otomatik olarak ana sayfaya alacak.'
      },
      en: {
        title: 'Email verified',
        message: 'Return to the Toldya app. The app will automatically take you to Home.'
      },
      de: {
        title: 'E-Mail bestätigt',
        message: 'Kehre zur Toldya-App zurück. Die App bringt dich automatisch zur Startseite.'
      }
    };
    const locale = (navigator.language || 'en').slice(0, 2);
    const t = copy[locale] || copy.en;
    document.getElementById('title').textContent = t.title;
    document.getElementById('message').textContent = t.message;
  </script>
</body>
</html>
