<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1C1C1E">
  <title>Toldya | Şifre güncellendi</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1c1c1e;
      --card: #252530;
      --border: #2c2c38;
      --text: #e8e8ed;
      --muted: #a0a0b0;
      --blue: #2563eb;
      --green: #2ed573;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.24), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: rgba(37, 37, 48, 0.9);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .check {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: rgba(46, 213, 115, 0.16);
      color: var(--green);
      font-size: 48px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .open-app {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 22px;
      padding: 14px 22px;
      min-width: 220px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
    }

    .open-app:active {
      transform: scale(0.98);
    }

    .hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>
    <h1 id="title">Şifren güncellendi</h1>
    <p id="message">Yeni şifren kaydedildi. Devam etmek için Toldya uygulamasını aç ve giriş yap.</p>
    <a class="open-app" id="openApp" href="#">Toldya'da giriş yap</a>
    <p class="hint" id="hint">Buton uygulamayı açar. Açılmazsa son uygulamalar menüsünden Toldya'yı seç.</p>
  </main>
  <script src="/auth/app-return.js"></script>
  <script>
    const copy = {
      tr: {
        title: 'Şifren güncellendi',
        message: 'Yeni şifren kaydedildi. Devam etmek için Toldya uygulamasını aç ve giriş yap.',
        button: "Toldya'da giriş yap",
        hint: "Aşağıdaki buton uygulamayı açar. Açılmazsa son uygulamalar menüsünden Toldya'yı seç."
      },
      en: {
        title: 'Password updated',
        message: 'Your new password is saved. Open the Toldya app to sign in.',
        button: 'Sign in on Toldya',
        hint: 'Tap the button to open the app. If nothing happens, pick Toldya from your recent apps.'
      },
      de: {
        title: 'Passwort aktualisiert',
        message: 'Dein neues Passwort wurde gespeichert. Öffne die Toldya-App und melde dich an.',
        button: 'In Toldya anmelden',
        hint: 'Tippe auf die Schaltfläche, um die App zu öffnen. Falls nichts passiert, wähle Toldya in den zuletzt verwendeten Apps.'
      }
    };
    const locale = (navigator.language || 'en').slice(0, 2);
    const t = copy[locale] || copy.en;
    document.getElementById('title').textContent = t.title;
    document.getElementById('message').textContent = t.message;
    document.getElementById('hint').textContent = t.hint;
    ToldyaAppReturn.applyToElement(document.getElementById('openApp'), t.button, 'passwordReset');
  </script>
</body>
</html>
